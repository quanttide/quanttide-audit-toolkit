[package]
name = "quanttide-audit"
version = "0.1.0"
edition = "2024"
description = "审计领域 Rust 语言工具包"
license = "Apache-2.0"
repository = "https://github.com/quanttide/quanttide-audit-toolkit"
readme = "README.md"
keywords = ["quanttide", "audit", "toolkit"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"

[lib]
name = "quanttide_audit"
path = "src/lib.rs"
